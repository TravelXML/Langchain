[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-automation"
version = "0.1.0"
description = "Local-first multi-agent job discovery, matching, and application automation platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "tenacity>=8.3",
  "langgraph>=0.1",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.2",
  "playwright>=1.44",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "reportlab>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection pattern is Depends(...) as an argument
# default — that's idiomatic here, not the mutable-default footgun B008
# otherwise guards against.
"app/api/routes/*.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
