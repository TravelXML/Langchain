<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Simple Application Form</title>
</head>
<body>
  <h1>Apply for Senior Engineer</h1>
  <form id="application-form">
    <label for="full-name">Full Name</label>
    <input type="text" id="full-name" name="full_name" data-testid="full-name-input" />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" data-testid="email-input" />

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" data-testid="phone-input" />

    <label for="experience">Years of Experience</label>
    <input type="number" id="experience" name="experience_years" data-testid="experience-input" />

    <button type="submit" data-testid="submit-button">Submit Application</button>
  </form>
  <div id="result" hidden>Application received.</div>

  <script>
    document.getElementById('application-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('application-form').hidden = true;
      document.getElementById('result').hidden = false;
    });
  </script>
</body>
</html>
