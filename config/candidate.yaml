# Candidate search & matching preferences.
# Personal identity fields (name, contact info, work history) are extracted
# from the resume in Phase 1 and stored separately — this file only holds
# job-search preferences, which the UI will eventually edit directly.

candidate:
  target_positions: []

  preferred_industries: []

  skills:
    primary: []
    secondary: []

  locations:
    preferred: []
    excluded: []
    relocation_allowed: false

  work_mode:
    - remote
    - hybrid
    - onsite

  # Sensitive (Section 18) — leave unset until the candidate explicitly
  # provides it. Guardrails treat an unset value as HUMAN_INPUT_REQUIRED,
  # never guessed. Example values: "citizen", "permanent_resident",
  # "visa_required", "authorized_no_sponsorship".
  work_authorization: null

  compensation:
    currency: USD
    minimum: 0
    preferred: 0

  companies:
    prioritize: []
    exclude: []

  keywords:
    include: []
    exclude: []

  minimum_match_score: 75

  maximum_applications_per_day: 30
